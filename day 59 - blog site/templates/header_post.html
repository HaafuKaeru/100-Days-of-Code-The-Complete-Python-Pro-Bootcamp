<!-- Page Header-->
<header class="masthead" style="background-image: url('../static/assets/img/post{{ _id }}-bg.jpg')">
    <div class="container position-relative px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <div class="post-heading">
                    <h1>{{ content.title }}</h1>
                    <h2 class="subheading">{{ content.subtitle }}</h2>
                    <span class="meta">
                        Posted by
                        <a href="https://github.com/HaafuKaeru">{{ author }}</a>
                        on {{ date }}
                    </span>
                </div>
            </div>
        </div>
    </div>
</header>
