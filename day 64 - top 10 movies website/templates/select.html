{% extends 'base.html' %}
{% block title %}Select Movie{% endblock %}
{% block content %}
<div class="container mt-5">
  <h1 class="heading">Select Movie</h1>
  <div class="container my-3">
    {% for movie in movies %}
      <p>
        <a href="{{ url_for('add', id=movie['id']) }}">
          {{ movie["title"] }} - {{ movie["release_date"].split("-")[0] }}
        </a>
      </p>
    {% endfor %}
  </div>
</div>
{% endblock %}
